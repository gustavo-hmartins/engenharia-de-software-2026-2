name: Testes Automatizados

on:
  push:
    branches: [ main, GusttavoFS-patch-9 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./carteira-investimentos

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: carteira-investimentos/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --ci
